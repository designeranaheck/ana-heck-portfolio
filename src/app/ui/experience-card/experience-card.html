<div class="experience-card">
  @if (experience().logo) {
    <div class="experience-card__photo">
      <img [src]="experience().logo" [alt]="experience().company" loading="lazy" decoding="async" />
    </div>
  } @else {
    <div class="ph experience-card__photo">{{ i18n.t('experienceCardPhotoAlt') }}</div>
  }

  <div class="experience-card__body">
    <span class="experience-card__role">{{ experience().role }}</span>
    @if (experience().company) {
      <span class="experience-card__company">{{ experience().company }}</span>
    }
    <div class="experience-card__row">
      <span class="experience-card__badge" [class.experience-card__badge--bordered]="bordered()">
        {{ experience().badge }}
      </span>
      <span class="experience-card__period">{{ experience().period }}</span>
    </div>
    <p class="experience-card__description">{{ experience().description }}</p>
  </div>
</div>
