<div id="contato" class="contact__card" appReveal>
  <span class="contact__kicker">{{ i18n.t('contactKicker') }}</span>
  <h2 class="section-title section-title--sm">
    {{ i18n.t('contactTitlePre') }}
    {{ i18n.t('contactTitleAccent') }}
  </h2>

  <div class="contact__grid">
    @for (channel of channels(); track $index) {
      <div class="contact__channel">
        <span class="contact__icon" aria-hidden="true">
          @switch (channel.icon) {
            @case ('email') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2.5" />
                <path d="M4 6.5 12 13l8-6.5" />
              </svg>
            }
            @case ('whatsapp') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.5 17.5 4 20l2.6-.7A8 8 0 1 0 4 12a7.9 7.9 0 0 0 1.1 4.1Z" />
                <path d="M9 10.3c0 3 2.7 5.7 5.7 5.7.6 0 1-.5.9-1.1l-.2-1.1a.9.9 0 0 0-.7-.7l-1.4-.3a.9.9 0 0 0-.9.3l-.3.4a4.6 4.6 0 0 1-2.6-2.6l.4-.3a.9.9 0 0 0 .3-.9l-.3-1.4a.9.9 0 0 0-.7-.7L8.9 7.4a.9.9 0 0 0-1 .9c0 .1 0 .1 0 0Z" />
              </svg>
            }
            @case ('resume') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5A1.5 1.5 0 0 1 7 3.5Z" />
                <path d="M14 3.5V8h4" />
                <path d="M9.5 12h5M9.5 15.5h5" />
              </svg>
            }
          }
        </span>
        <span class="contact__label">{{ channel.label }}</span>
        <a
          class="contact__value"
          [href]="channel.href"
          [attr.download]="channel.icon === 'resume' ? 'Ana-Heck-Curriculo.pdf' : null"
        >{{ channel.value }}</a>
      </div>
    }
  </div>
</div>
